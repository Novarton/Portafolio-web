<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Netlify Detection</title></head>
<body>
  <form name="contact" action="/success" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <textarea name="message"></textarea>
    <input name="bot-field" />
    <input type="hidden" name="form-name" value="contact" />
  </form>
</body>
</html>
